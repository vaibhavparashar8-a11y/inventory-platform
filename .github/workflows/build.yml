name: build

# Runs on every branch, not just PRs: the whole point of pulling CI forward is
# that work is checked while it is being written, not once at the end.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build, test and gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # verify runs the lot: compile, unit tests, ArchUnit, and the Spotless
      # formatting gate. Gates are gates — nothing here is advisory.
      - name: Build, test and check formatting
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

  openapi-lint:
    name: lint openapi contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The specs are what clients are generated from, so a spec that merely
      # parses is not enough — it has to be unambiguous. Warnings are visible but
      # only errors fail the build.
      - name: Lint contracts
        run: npx --yes @stoplight/spectral-cli@latest lint "contracts/*.yaml" --ruleset .spectral.yaml

  postgres-migrations:
    name: migrations against real postgresql
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Docker is not available on the dev machine, so this job is not a
    # convenience — it is the ONLY proof that the migrations are portable
    # between the local engine (H2) and the cloud one. See ADR 0002.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Each service migrates its own database, so each gets its own schema.
      # A failure here means a migration is engine-specific — exactly what
      # CLOB and bare TIMESTAMP already turned out to be.
      - name: Run migrations against PostgreSQL
        run: |
          ./mvnw -B --no-transfer-progress -pl services/catalog-service,services/stock-service -am \
            -DskipTests package
          for service in catalog stock; do
            echo "::group::$service migrations"
            java -cp "services/$service-service/target/classes:$(./mvnw -q -pl services/$service-service dependency:build-classpath -Dmdep.outputFile=/dev/stdout -DincludeScope=runtime | tail -1)" \
              org.flywaydb.core.Flyway \
              -url="jdbc:postgresql://localhost:5432/inventory?currentSchema=$service" \
              -user=inventory -password=inventory \
              -schemas="$service" \
              -locations="classpath:db/migration/$service" \
              -createSchemas=true \
              migrate
            echo "::endgroup::"
          done

  launcher-smoke:
    name: composite launcher smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # BUILD_PROMPT.md §3: the desktop deployment story must never silently rot.
    # If this breaks, the product has no delivery mechanism — and discovering
    # that during Phase 7 packaging would be far too late.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Start every service in one JVM and drive it over HTTP
        run: ./mvnw -B --no-transfer-progress -pl launcher -am verify

  # ---------------------------------------------------------------------------
  # Still to come:
  #   openapi-breaking — once a spec has been released and can be broken.
  #                      Meaningless before there is a baseline to compare to.
  # ---------------------------------------------------------------------------
