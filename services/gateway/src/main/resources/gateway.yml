spring:
  application:
    name: gateway

server:
  # Loopback only in desktop mode. Never bind 0.0.0.0 here: there is no
  # authentication (ADR 0005), so reachability is the whole boundary.
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]'

management.tracing:
  sampling:
    probability: 1.0
